<footer class="footer">
  <div class="wrap">
    <div class="sign" #sign aria-hidden="true">
      <p class="sign__outline">Victor Amos</p>
      <p class="sign__lit">Victor Amos</p>
      <span class="sign__bulb"></span>
      <span class="sign__floor"></span>
    </div>

    <div class="footer__row">
      <p>© {{ year }} {{ profile.firstName }} {{ profile.lastName }}, {{ profile.city }}. Conçu et développé avec Angular.</p>

      <div class="footer__links">
        <ul class="icons" aria-label="Réseaux et contact">
          @for (s of socials; track s.label) {
            <li>
              <a class="icon-btn" [href]="s.url" target="_blank" rel="noopener me" [attr.aria-label]="s.label + ', ' + s.handle">
                <app-social-icon [name]="s.icon" [size]="19" />
              </a>
            </li>
          }
          <li>
            <a class="icon-btn" [href]="'mailto:' + profile.email" [attr.aria-label]="'E-mail, ' + profile.email">
              <app-social-icon name="email" [size]="19" />
            </a>
          </li>
        </ul>
        <a class="top link" routerLink="/" fragment="top">Haut de page</a>
      </div>
    </div>
  </div>
</footer>
